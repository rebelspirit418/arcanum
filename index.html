<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Arcanum Julian — калькулятор «Круг 22» по юлианской дате и ведическая астрология D1–D1000.">
<meta name="robots" content="index,follow">
<meta name="referrer" content="no-referrer">
<title>Arcanum Julian</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23000%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22none%22 stroke=%22%23e3122d%22 stroke-width=%222%22/%3E%3Cg fill=%22none%22 stroke=%22%23e3122d%22 stroke-width=%221.6%22 stroke-linejoin=%22round%22 opacity=%22.95%22%3E%3Cpolygon points=%2250.00%2C10.00 15.36%2C70.00 84.64%2C70.00%22/%3E%3Cpolygon points=%2238.21%2C11.78 22.79%2C79.32 89.00%2C58.90%22/%3E%3Cpolygon points=%2227.47%2C16.95 32.64%2C86.04 89.89%2C47.01%22/%3E%3Cpolygon points=%2218.73%2C25.06 44.04%2C89.55 87.23%2C35.39%22/%3E%3Cpolygon points=%2212.77%2C35.39 55.96%2C89.55 81.27%2C25.06%22/%3E%3Cpolygon points=%2210.11%2C47.01 67.36%2C86.04 72.53%2C16.95%22/%3E%3Cpolygon points=%2211.00%2C58.90 77.21%2C79.32 61.79%2C11.78%22/%3E%3C/g%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%227%22 fill=%22%23e3122d%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%222.6%22 fill=%22%23000%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:#050505;--line:#1a1a1a;--line2:#2a2a2a;
  --gold:#8a8a8a;--gold2:#2a2a2a;--saffron:#e3122d;--red:#e3122d;--red2:#7a0a19;
  --text:#ececec;--muted:#808080;--ice:#d6d6d6;
  --disp:"Bank Gothic","BankGothic Md BT","BankGothic Lt BT","Jura","Eurostile",sans-serif;--body:"Manrope","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#000;background-image:radial-gradient(ellipse 80% 40% at 50% 0,rgba(227,18,45,.10),transparent 70%);
  color:var(--text);font-family:var(--body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--red)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.om{color:var(--muted);letter-spacing:5px;font-size:11px;font-family:var(--disp);font-weight:500}
.lang button{background:transparent;color:var(--muted);border:1px solid var(--line2);font:400 12px var(--disp);padding:6px 12px;cursor:pointer;letter-spacing:1px;border-radius:2px}
.lang button.on{background:var(--red);color:#fff;border-color:var(--red)}
.logo{text-align:center;padding:26px 0 28px}
.logo h1{margin:0;font-family:var(--disp);font-weight:500;font-size:clamp(26px,5.4vw,54px);letter-spacing:2px;text-transform:uppercase;color:#fff;
  text-shadow:0 0 30px rgba(227,18,45,.45)}
.logo h1::after{content:"";display:block;width:80px;height:2px;background:var(--red);margin:16px auto 0}
.logo .sub{color:var(--muted);letter-spacing:6px;text-transform:uppercase;font-size:clamp(10px,2vw,13px);margin-top:14px;font-family:var(--disp);font-weight:500}
.ticker{background:#000;color:var(--red);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 0;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-family:var(--disp);font-weight:500}
section{margin:22px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 0 20px;position:relative}
.box::before{content:"";position:absolute;left:0;top:0;width:3px;height:52px;background:var(--red)}
.ttl{margin:0 0 18px;font-family:var(--disp);font-weight:400;color:#fff;text-transform:uppercase;letter-spacing:3px;font-size:clamp(13px,2.2vw,16px);padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.in{padding:0 22px}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.form label{display:flex;flex-direction:column;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;gap:6px;font-family:var(--disp);font-weight:500}
.form select,.form input{background:#000;color:#fff;border:1px solid var(--line2);font:400 18px var(--disp);padding:9px 10px;min-width:80px;border-radius:2px;outline:none}
.form select:focus,.form input:focus{border-color:var(--red)}
.form input{width:110px}
.btn{background:var(--red);color:#fff;border:1px solid var(--red);font:400 14px var(--disp);text-transform:uppercase;letter-spacing:3px;padding:13px 28px;cursor:pointer;border-radius:2px;transition:.2s}
.btn:hover{background:#000;color:var(--red);box-shadow:0 0 20px rgba(227,18,45,.4)}
.conv{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px}
.conv .d{border:1px solid var(--line2);background:#000;padding:8px 14px;border-radius:2px;font-family:var(--disp);font-weight:500}
.conv .j{border-color:var(--red);color:#fff;box-shadow:0 0 18px rgba(227,18,45,.25)}
.err{color:var(--red);margin-top:10px}
.base{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.base div{border:1px solid var(--line);padding:6px 12px;background:#000;color:var(--muted);font-family:var(--disp);font-weight:500;font-size:13px;border-radius:2px}
.base b{color:#fff;font-size:17px;font-weight:400}
.wheelwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.wheelwrap{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block}
.chk{width:100%;border-collapse:collapse}
.chk td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
.ball{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-weight:400;color:#fff;font-size:14px;flex:none;font-family:var(--disp)}
.cname{font-weight:400;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;font-family:var(--disp)}
.small{color:var(--muted);font-size:12.5px}
.load{display:grid;gap:10px}
.load .row{display:grid;grid-template-columns:160px 1fr 30px;gap:12px;align-items:center;font-size:14px}
.load b{font-weight:400;font-family:var(--disp)}
.bar{height:6px;background:#141414;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:#000;border:1px solid var(--line);border-left:2px solid var(--red);padding:12px 14px;border-radius:2px}
.card .h{display:flex;gap:12px;align-items:center}
.card .pn{color:var(--muted);font-size:11px;letter-spacing:1px;font-family:var(--disp);font-weight:500}
.card .nm{font-size:14px;text-transform:uppercase;font-family:var(--disp);font-weight:400;letter-spacing:1px;margin-top:2px}
.card .fx{color:var(--muted);font-size:11px;font-family:Consolas,monospace}
.card .tcm{margin-top:8px;font-size:13.5px}
.tag{display:inline-block;border:1px solid var(--line2);padding:2px 8px;margin:2px 4px 2px 0;font-size:11px;color:var(--ice);background:#0a0a0a;border-radius:2px}
.card .mus{margin-top:8px;font-size:12px;color:var(--muted)}
.card .soc{margin-top:8px;font-size:14px}.card .soc p{margin:4px 0}
.shadow{color:#ff5a6e}
details{border:1px solid var(--line);margin:6px 0;background:#000;border-radius:2px}
summary{cursor:pointer;padding:9px 12px;display:flex;gap:12px;align-items:center;list-style:none;font-family:var(--disp);font-weight:500;font-size:13px;letter-spacing:.5px}
summary::-webkit-details-marker{display:none}
details[open] summary{background:linear-gradient(90deg,rgba(227,18,45,.12),transparent)}
details .body{padding:4px 14px 12px 58px;font-size:14px}
@media(max-width:600px){details .body{padding-left:14px}}
.method ol{padding-left:22px}.method li{margin:8px 0}
.warn{border:1px solid var(--red2);border-left:3px solid var(--red);padding:10px 14px;color:#ff8d9b;margin-top:14px;font-size:13.5px;background:rgba(227,18,45,.05)}
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0 34px;text-align:center;color:var(--muted);font-size:12.5px}
footer .c{color:#fff;letter-spacing:4px;text-transform:uppercase;font-family:var(--disp);font-weight:500;font-size:12px;margin-bottom:8px}
.mc{background:#000;border:1px solid var(--line);padding:12px 14px;margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:14px;border-radius:2px}
.mc .cn{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;font-family:var(--disp);font-weight:400}
.mc p{margin:6px 0 0;font-size:14px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.key{border:1px solid var(--line2);background:linear-gradient(160deg,#0e0e0e,#000 60%);padding:20px;border-radius:3px;border-top:2px solid var(--red)}
.key .kh{display:flex;gap:16px;align-items:center}
.key .big{width:60px;height:60px;font-size:24px}
.key .kp{font-family:var(--disp);font-weight:500;color:var(--muted);letter-spacing:1.5px;font-size:11px}
.key .kn{font-family:var(--disp);font-weight:400;font-size:19px;text-transform:uppercase;color:#fff;margin-top:2px}
.key .kd{color:var(--muted);font-size:13px;margin:12px 0 0}
.key p{margin:8px 0 0;font-size:14.5px}
b{font-weight:600}
.box{transition:border-color .25s}.box:hover{border-color:#2a2a2a}
.card,.mc,details{transition:border-color .2s,transform .2s}.card:hover{border-color:#333;transform:translateY(-1px)}
.logo h1{letter-spacing:6px;font-weight:400}
.scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:0;margin-top:22px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;font:500 13px var(--disp);letter-spacing:2px;text-transform:uppercase;padding:12px 18px;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:#fff;border-bottom-color:var(--red)}
.tabs button:hover{color:#fff}
.pair{display:flex;gap:4px}.pair select{min-width:60px;font-size:16px}
.vform input[type=text]{font-size:17px}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:760px){.charts2{grid-template-columns:1fr}}
.csel{display:flex;gap:8px;margin-bottom:10px}.csel select,.csel input{background:#000;color:#fff;border:1px solid var(--line2);font:500 13px var(--disp);padding:7px 8px;border-radius:2px}
.csel select{flex:1;min-width:0}.csel input{width:84px;display:none}
.nchart{max-width:460px;margin:0 auto;font-family:var(--disp)}
.vt{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
.vt th{font:500 11px var(--disp);letter-spacing:1px;color:var(--muted);text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}
.vt td{padding:8px 10px;border-bottom:1px solid var(--line)}
.vt tr.as td{color:#ff8d9b}.vt tr:hover td{background:#0b0b0b}
.vt .sg{font-family:var(--disp);color:#fff;margin-right:4px}.vt .dg{color:var(--muted);font-size:11px}
#vvarg td,#vvarg th{text-align:center;padding:7px 8px}
.mono{font-family:Consolas,"Courier New",monospace}
.rr{color:var(--red);font-size:11px;font-weight:600}
.vgroups{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.vgroups button{background:transparent;color:var(--muted);border:1px solid var(--line2);font:500 12px var(--disp);padding:7px 12px;cursor:pointer;border-radius:2px;letter-spacing:1px}
.vgroups button.on{background:var(--red);color:#fff;border-color:var(--red)}
.ad{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}.ad.cur{color:#fff}.ad.cur span:first-child::before{content:"● ";color:var(--red)}
.logo .mark{width:84px;height:84px;display:block;margin:0 auto 18px;filter:drop-shadow(0 0 18px rgba(227,18,45,.45))}
.om{display:flex;align-items:center;gap:10px}.minimark svg{display:block}
</style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <div class="om"><span class="minimark"><svg width="18" height="18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#e3122d" stroke-width="2"/><g fill="none" stroke="#e3122d" stroke-width="1.6" stroke-linejoin="round" opacity=".95"><polygon points="50.00,10.00 15.36,70.00 84.64,70.00"/><polygon points="38.21,11.78 22.79,79.32 89.00,58.90"/><polygon points="27.47,16.95 32.64,86.04 89.89,47.01"/><polygon points="18.73,25.06 44.04,89.55 87.23,35.39"/><polygon points="12.77,35.39 55.96,89.55 81.27,25.06"/><polygon points="10.11,47.01 67.36,86.04 72.53,16.95"/><polygon points="11.00,58.90 77.21,79.32 61.79,11.78"/></g><circle cx="50" cy="50" r="7" fill="#e3122d"/><circle cx="50" cy="50" r="2.6" fill="#000"/></svg></span>ARCANUM · JULIAN · 22</div>
    <div class="lang"><button data-l="ru">RU</button> <button data-l="en">EN</button></div>
  </div>
  <div class="wrap logo">
    <svg class="mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#e3122d" stroke-width="2"/><g fill="none" stroke="#e3122d" stroke-width="1.6" stroke-linejoin="round" opacity=".95"><polygon points="50.00,10.00 15.36,70.00 84.64,70.00"/><polygon points="38.21,11.78 22.79,79.32 89.00,58.90"/><polygon points="27.47,16.95 32.64,86.04 89.89,47.01"/><polygon points="18.73,25.06 44.04,89.55 87.23,35.39"/><polygon points="12.77,35.39 55.96,89.55 81.27,25.06"/><polygon points="10.11,47.01 67.36,86.04 72.53,16.95"/><polygon points="11.00,58.90 77.21,79.32 61.79,11.78"/></g><circle cx="50" cy="50" r="7" fill="#e3122d"/><circle cx="50" cy="50" r="2.6" fill="#000"/></svg>
    <h1 data-t="title"></h1>
    <div class="sub" data-t="subtitle"></div>
  </div>
  <div class="ticker"><marquee scrollamount="5" data-t="ticker"></marquee></div>
</header>

<nav class="wrap tabs"><button data-tab="arc" class="on" data-t="tabArc"></button><button data-tab="ved" data-t="tabVed"></button></nav>
<main class="wrap">
<div id="tab-arc">
  <section class="box">
    <h2 class="ttl" data-t="inputTitle"></h2>
    <div class="in">
      <div class="form">
        <label><span data-t="day"></span><select id="d"></select></label>
        <label><span data-t="month"></span><select id="m"></select></label>
        <label><span data-t="year"></span><input id="y" type="number" min="1600" max="2200" value="2000"></label>
        <button class="btn" id="go" data-t="calc"></button>
      </div>
      <div id="err" class="err"></div>
      <div class="conv" id="conv"></div>
      <div class="base" id="base"></div>
    </div>
  </section>

  <div id="out" hidden>
    <section class="box">
      <h2 class="ttl" data-t="wheelTitle"></h2>
      <div class="in wheelwrap">
        <div id="wheel"></div>
        <div>
          <table class="chk" id="chk"></table>
          <p class="small" data-t="chakraNote"></p>
        </div>
      </div>
    </section>

    <section class="box">
      <h2 class="ttl" data-t="loadTitle"></h2>
      <div class="in"><div class="load" id="load"></div><p class="small" data-t="loadNote"></p></div>
    </section>

    <section class="box">
      <h2 class="ttl" data-t="keyTitle"></h2>
      <div class="in"><p class="small" data-t="keyNote"></p><div class="keys" id="keys"></div></div>
    </section>

    <section class="box">
      <h2 class="ttl" data-t="posTitle"></h2>
      <div class="in"><div class="cards" id="cards"></div></div>
    </section>

    <section class="box">
      <h2 class="ttl" data-t="medTitle"></h2>
      <div class="in"><p class="small" data-t="medNote"></p><div id="med"></div></div>
    </section>
  </div>

  <section class="box">
    <h2 class="ttl" data-t="refTitle"></h2>
    <div class="in"><p class="small" data-t="refNote"></p><div id="ref"></div></div>
  </section>

  <section class="box method">
    <h2 class="ttl" data-t="methodTitle"></h2>
    <div class="in" id="method"></div>
  </section>
</div>
<div id="tab-ved" hidden>
  <section class="box">
    <h2 class="ttl" data-v="vInTitle"></h2>
    <div class="in">
      <div class="form vform">
        <label><span data-v="vCal"></span><select id="vcal"><option value="g"></option><option value="j"></option></select></label>
        <label><span data-v="vDate"></span><input id="vdate" type="text" value="01.01.2000" placeholder="ДД.ММ.ГГГГ" style="width:150px"></label>
        <label><span data-v="vTime"></span><input id="vtime" type="text" value="12:00:00" placeholder="ЧЧ:ММ:СС" style="width:130px"></label>
        <label><span data-v="vTz"></span><input id="vtz" type="text" value="+0:00" style="width:100px"></label>
        <label><span data-v="vLat"></span><span class="pair"><input id="vlatd" type="number" value="51" min="0" max="90" style="width:70px"><input id="vlatm" type="number" value="30" min="0" max="59" style="width:64px"><select id="vlats"><option>N</option><option>S</option></select></span></label>
        <label><span data-v="vLon"></span><span class="pair"><input id="vlond" type="number" value="0" min="0" max="180" style="width:76px"><input id="vlonm" type="number" value="7" min="0" max="59" style="width:64px"><select id="vlons"><option>E</option><option selected>W</option></select></span></label>
        <button class="btn" id="vgo" data-v="vCalc"></button>
      </div>
      <div id="verr" class="err"></div>
      <div class="base" id="vbase"></div>
    </div>
  </section>

  <div id="vout" hidden>
    <section class="box">
      <h2 class="ttl" data-v="vChartsTitle"></h2>
      <div class="in">
        <div class="charts2">
          <div><div class="csel"><select id="vsel1"></select><input id="vcust1" type="number" min="1" max="1000" placeholder="Dn"></div><div id="vchart1"></div></div>
          <div><div class="csel"><select id="vsel2"></select><input id="vcust2" type="number" min="1" max="1000" placeholder="Dn"></div><div id="vchart2"></div></div>
        </div>
        <p class="small" data-v="vChartNote"></p>
      </div>
    </section>

    <section class="box">
      <h2 class="ttl" data-v="vPlTitle"></h2>
      <div class="in scroll"><table class="vt" id="vtab"></table></div>
    </section>

    <section class="box">
      <h2 class="ttl" data-v="vVargTitle"></h2>
      <div class="in">
        <div class="vgroups" id="vgroups"></div>
        <div class="scroll"><table class="vt" id="vvarg"></table></div>
        <p class="small" data-v="vVargNote"></p>
      </div>
    </section>

    <section class="box">
      <h2 class="ttl" data-v="vDashaTitle"></h2>
      <div class="in"><div id="vdasha"></div></div>
    </section>

    <section class="box method">
      <h2 class="ttl" data-v="vMethodTitle"></h2>
      <div class="in" id="vmethod"></div>
    </section>
  </div>
</div>
</main>

<footer>
  <div class="wrap">
    <div class="c">Arcanum Julian · Круг 22</div>
    <div id="copy"></div>
  </div>
</footer>

<script>
/* ===================== DATA ===================== */
const ARC={
 ru:["","Маг","Жрица","Императрица","Император","Жрец","Влюблённые","Колесница","Справедливость","Отшельник","Колесо Фортуны","Сила","Повешенный","Смерть","Умеренность","Дьявол","Башня","Звезда","Луна","Солнце","Суд","Мир","Дурак"],
 en:["","Magician","High Priestess","Empress","Emperor","Hierophant","Lovers","Chariot","Justice","Hermit","Wheel of Fortune","Strength","Hanged Man","Death","Temperance","Devil","Tower","Star","Moon","Sun","Judgement","World","Fool"]
};
// elements

 let s=`<svg viewBox="-2 -2 334 334" class="nchart"><rect x="0" y="0" width="330" height="330" fill="#050505" stroke="#2a2a2a"/>`;
 s+=`<path d="M0 0L330 330M330 0L0 330M165 0L330 165L165 330L0 165Z" stroke="#2a2a2a" fill="none"/>`;
 H.forEach((poly,i)=>{const sign=(asc+i)%12,cx=poly.reduce((a,p)=>a+p[0],0)/poly.length,cy=poly.reduce((a,p)=>a+p[1],0)/poly.length;
  const inner=poly.reduce((b,p)=>Math.hypot(p[0]-C,p[1]-C)<Math.hypot(b[0]-C,b[1]-C)?p:b);const sx=cx+0.62*(inner[0]-cx),sy=cy+0.62*(inner[1]-cy);
  s+=`<text x="${sx}" y="${sy+4}" text-anchor="middle" font-size="11" fill="#666">${sign+1}</text>`;
  const here=VP.filter(k=>vs[k].s===sign&&!(k==='As'&&lagnaSign!=null&&false));const big=poly.length===4,vert=[2,4,8,10].includes(i);const per=big?3:vert?1:3,lh=vert?25:26;
  const rows=[];for(let j=0;j<here.length;j+=per)rows.push(here.slice(j,j+per));
  const oy=cy-(rows.length-1)*lh/2-(big?6:0)+(vert?0:(i===1||i===11?-10:i===5||i===7?8:0));
  rows.forEach((r,ri)=>{const sp=big?40:34,w=r.length*sp;r.forEach((k,ci)=>{const x=cx-w/2+sp/2+ci*sp,y=oy+ri*lh;const col=k==='As'?'#e3122d':'#ececec';
   s+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="12.5" fill="${col}" font-weight="600">${P[k]}${retro[k]&&k!=='As'?'<tspan font-size="8" fill="#e3122d" dy="-5">R</tspan>':''}</text><text x="${x}" y="${y+(retro[k]&&k!=='As'?14:9)}" text-anchor="middle" font-size="8.5" fill="#808080">${String(Math.floor(vs[k].deg)).padStart(2,"0")}°</text>`})});
 });
 return s+"</svg>"}
function vOpts(){const o=[`<option value="mo">${VV[L].moonC}</option>`,`<option value="su">${VV[L].sunC}</option>`];
 for(const n of [...STD,...EXT])o.push(`<option value="${n}">D${n}${VNAME[L][n]?" · "+VNAME[L][n]:""}</option>`);o.push(`<option value="c">${VV[L].custom}</option>`);return o.join("")}
function drawSel(i){const sel=$v("vsel"+i),c=$v("vcust"+i);c.style.display=sel.value==="c"?"inline-block":"none";
 let n=1,lag=null;if(sel.value==="mo"){lag=Math.floor(VR.pos.Mo/30)}else if(sel.value==="su"){lag=Math.floor(VR.pos.Su/30)}else if(sel.value==="c"){n=Math.max(1,Math.min(1000,+c.value||1))}else n=+sel.value;
 const title=sel.value==="c"?`D${n}`:"";$v("vchart"+i).innerHTML=(title?`<div class="small" style="text-align:center">${title}</div>`:"")+northChart(sel,n,lag)}
function vRender(){if(!VR)return;const {p,pos,retro}=VR,T=VV[L];
 const c=V.calOf(p.jd);
 $v("vbase").innerHTML=`<div>${T.ayan}: <b>${fdm(pos.ay)}</b></div><div>${T.jd}: <b>${p.jd.toFixed(5)}</b></div><div>UT: <b>${fdate(p.jd)} ${String(Math.floor(((p.jd+0.5)%1)*24)).padStart(2,"0")}:${String(Math.floor(((p.jd+0.5)%1)*1440)%60).padStart(2,"0")}</b></div>`;
 // table
 const kr=['Su','Mo','Ma','Me','Ju','Ve','Sa'].sort((a,b)=>(pos[b]%30)-(pos[a]%30));const kar={};kr.forEach((k,i)=>kar[k]=KAR[L][i]);
 const asS=Math.floor(pos.As/30);
 let h=`<tr><th>${T.hP}</th><th>${T.hK}</th><th>${T.hDeg}</th><th>${T.hR}</th><th>${T.hN}</th><th>${T.hNak}</th><th>${T.hRel}</th><th>${T.hH}</th><th>${T.hL}</th></tr>`;
 for(const k of VP){const lon=pos[k],s=Math.floor(lon/30),nk=Math.floor(lon/(40/3)),pada=Math.floor((lon%(40/3))/(10/3))+1;
  let r="-",hs="-",lo="-";
  if(k!=='As'){const rr=rel(k,lon,pos);r=T.rel[rr[0]]+(rr[1]?`, ${rr[1]}°`:"");hs=((s-asS+12)%12)+1;
   if(k==='Ra')lo=`${T.co} ${((10-asS+12)%12)+1}${T.hh}`;else if(k==='Ke')lo=`${T.co} ${((7-asS+12)%12)+1}${T.hh}`;
   else lo=SLORD.map((l,i)=>l===k?((i-asS+12)%12)+1:0).filter(Boolean).sort((a,b)=>a-b).map(x=>x+T.hh).join(", ")}
  h+=`<tr${k==='As'?' class="as"':''}><td><b>${VPN[L][k]}</b>${retro[k]&&k!=='As'?' <span class="rr">R</span>':''}</td><td>${kar[k]||"-"}</td><td class="mono">${fdm(lon%30)}</td><td>${SIGN[L][s]}</td><td>${SIGN[L][varga(lon,9).s]}</td><td>${NAK[L][nk]} (${pada}, ${VPA[L][DLORD[nk%9]]})</td><td>${r}</td><td>${hs}</td><td>${lo}</td></tr>`}
 $v("vtab").innerHTML=h;
 // charts
 for(const i of [1,2])drawSel(i);
 // varga table
 $v("vgroups").innerHTML=`<button class="${VGRP==='std'?'on':''}" data-g="std">${T.vStd}</button><button class="${VGRP==='ext'?'on':''}" data-g="ext">${T.vExt}</button>`;
 $v("vgroups").querySelectorAll("button").forEach(b=>b.onclick=()=>{VGRP=b.dataset.g;vRender()});
 const L2=VGRP==='std'?STD:EXT;let vt=`<tr><th></th>${L2.map(n=>`<th>D${n}</th>`).join("")}</tr>`;
 for(const k of VP)vt+=`<tr${k==='As'?' class="as"':''}><td><b>${VPA[L][k]}</b></td>${L2.map(n=>{const v=varga(pos[k],n);return `<td title="${SIGN[L][v.s]} ${v.deg.toFixed(2)}°"><span class="sg">${v.s+1}</span><span class="dg">${Math.floor(v.deg)}°</span></td>`}).join("")}</tr>`;
 $v("vvarg").innerHTML=vt;
 // dasha
 const mo=pos.Mo,nk=Math.floor(mo/(40/3)),fr=(mo%(40/3))/(40/3),l0=nk%9,Y=365.256363;
 let start=p.jd-fr*DYRS[DLORD[l0]]*Y,dh="";const now=V.jdOf(new Date().getUTCFullYear(),new Date().getUTCMonth()+1,new Date().getUTCDate(),12,false);
 for(let i=0;i<9;i++){const lord=DLORD[(l0+i)%9],len=DYRS[lord]*Y,end=start+len,cur=now>=start&&now<end;
  let ad="",as=start;for(let j=0;j<9;j++){const l2=DLORD[(l0+i+j)%9],ln=len*DYRS[l2]/120,ae=as+ln,c2=now>=as&&now<ae;ad+=`<div class="ad${c2?' cur':''}"><span>${VPN[L][lord]} / ${VPN[L][l2]}</span><span class="mono">${fdate(as)} — ${fdate(ae)}</span></div>`;as=ae}
  dh+=`<details${cur?' open':''}><summary><span class="ball" style="background:${cur?'#e3122d':'#1a1a1a'};border:1px solid #333">${DYRS[lord]}</span><span>${VPN[L][lord]}</span><span class="mono small" style="margin-left:auto">${fdate(start)} — ${fdate(end)}${cur?' · '+T.now:''}</span></summary><div class="body">${ad}</div></details>`;start=end}
 $v("vdasha").innerHTML=dh;
 $v("vout").hidden=false}
function vApplyLang(){document.querySelectorAll("[data-v]").forEach(el=>el.textContent=VV[L][el.dataset.v]);
 $v("vcal").options[0].textContent=VV[L].vCalG;$v("vcal").options[1].textContent=VV[L].vCalJ;
 for(const i of [1,2]){const s=$v("vsel"+i),v=s.value||(i===1?"1":"9");s.innerHTML=vOpts();s.value=v}
 $v("vmethod").innerHTML=VV[L].method;vRender()}
for(const i of [1,2]){$v("vsel"+i).onchange=()=>VR&&drawSel(i);$v("vcust"+i).oninput=()=>VR&&drawSel(i)}
$v("vgo").onclick=vCalc;

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("tab-arc").hidden=b.dataset.tab!=="arc";$("tab-ved").hidden=b.dataset.tab!=="ved";try{localStorage.setItem("arcTab",b.dataset.tab)}catch(e){}});
try{const t=localStorage.getItem("arcTab");if(t==="ved")document.querySelector('.tabs button[data-tab=ved]').click()}catch(e){}
vApplyLang();vCalc();
</script>
